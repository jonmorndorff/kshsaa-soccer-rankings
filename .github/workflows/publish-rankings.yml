name: Publish Soccer Results
on:
  workflow_dispatch:
  schedule:
    - cron: "20 11,23 * * *"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/collect.py --gender boys --year 2026
      - name: Check results
        run: |
          python -c "import json; d=json.load(open('data/boys-2026.json')); r=json.load(open('data/boys-2026-review.json')); assert len(d['teams']) >= 100; assert r['fetchedTeams'] >= 100; assert len(d['games']) >= 40; assert not r['conflicts']"
      - name: Save public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boys-2026.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh KSHSAA boys soccer results"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collector-diagnostics
          path: data/
          if-no-files-found: ignore
