name: Publish Soccer Results
on:
  workflow_dispatch:
  schedule:
    - cron: "20 11,23 * * *"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: kshsaa-results-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/collect.py --gender boys --year 2026
      - name: Check results
        run: |
          python -c "import json; d=json.load(open('data/boys-2026.json')); r=json.load(open('data/boys-2026-review.json')); assert len(d['teams']) >= 100; assert r['fetchedTeams'] >= 100; assert len(d['games']) >= 40; assert all('existing' in c and 'reported' in c for c in r['conflicts'])"
      - name: Save public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boys-2026.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh KSHSAA boys soccer results"
            # Rebase only the generated-data commit onto the newest main.
            # Retry if another workflow or edit advances main during publishing.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Generated data conflicted with upstream; stopping safely."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Published rankings successfully."
                exit 0
              fi
              sleep 3
            done
            echo "Unable to publish after five attempts."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collector-diagnostics
          path: data/
          if-no-files-found: ignore
