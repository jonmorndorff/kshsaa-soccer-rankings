
name: Test KSHSAA Collector

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Collect 2026 boys scores
        run: |
          python scripts/collect.py --gender boys --year 2026 --max-teams 3

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kshsaa-test-results
          path: data/
          if-no-files-found: warn
